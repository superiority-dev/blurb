version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    assignees:
      - likvidatorTM
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    assignees:
      - likvidatorTM
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    assignees:
      - likvidatorTM
    groups:
      opentelemetry:
        patterns:
          - go.opentelemetry.io/*
