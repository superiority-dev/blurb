name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
            Makefile

      - name: Check that the race detector starts
        id: race
        run: |
          if out=$(go test -race -count=1 -run '^$' ./internal/fetch 2>&1); then
            echo "run=1" >> "$GITHUB_OUTPUT"
          elif grep -q 'unsupported VMA range' <<< "$out"; then
            echo "::warning::the race detector cannot start on ${{ matrix.runner }}, so make check skips the -race run"
            echo "run=0" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

      - run: make check RACE=${{ steps.race.outputs.run }}

      - name: Coverage
        if: matrix.runner == 'ubuntu-24.04'
        run: go test -coverpkg="$(go list ./... | grep -v -e /internal/testimage -e /internal/testenv | paste -sd, -)" -coverprofile=coverage.out ./...

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.runner == 'ubuntu-24.04'
        with:
          files: coverage.out
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build for macOS and Windows
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/blurb
          done

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
